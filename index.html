<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="McDash">
  <title>McDash · Delivery</title>
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<div id="pantalla-login" class="login" hidden>
  <form id="form-login" class="login-caja">
    <div class="logo logo-grande">Mc<span>Dash</span></div>
    <p class="login-sub">Delivery · Portal Rosario</p>
    <label class="campo-grupo">
      <span class="etiqueta">Email</span>
      <input class="campo" type="email" id="login-email" autocomplete="username" required>
    </label>
    <label class="campo-grupo">
      <span class="etiqueta">Contraseña</span>
      <input class="campo" type="password" id="login-pass" autocomplete="current-password" required>
    </label>
    <button class="btn btn-primario btn-ancho" type="submit" id="btn-entrar">Entrar</button>
    <p id="login-error" class="mensaje-error" hidden></p>
  </form>
</div>

<!-- ═════════ APP ═════════ -->
<div id="pantalla-app" hidden>
  <header class="cabecera">
    <div class="logo">Mc<span>Dash</span></div>
    <button id="btn-salir" class="btn btn-fantasma btn-chico" type="button">Salir</button>
  </header>

  <nav class="pestanas" role="tablist">
    <button type="button" role="tab" data-vista="pedidos" aria-selected="true">🛵 Pedidos PeYa</button>
    <button type="button" role="tab" data-vista="pases" aria-selected="false">📋 Pase de turno</button>
  </nav>

  <main>
    <!-- ───── PEDIDOS ───── -->
    <section id="vista-pedidos" class="vista">

      <div class="buscador">
        <input id="buscar" class="campo campo-buscar" type="search" inputmode="numeric"
               placeholder="🔍 Buscar número de pedido" autocomplete="off" aria-label="Buscar número de pedido">
      </div>

      <section class="tarjeta-seccion">
        <h2 class="titulo-seccion">📸 Cargar pedidos</h2>
        <div class="fila-campos">
          <div class="campo-grupo">
            <span class="etiqueta">Turno</span>
            <div class="chips" id="pedidos-turno"></div>
          </div>
          <label class="campo-grupo">
            <span class="etiqueta">Responsable</span>
            <input class="campo" id="pedidos-responsable" placeholder="Tu nombre" autocomplete="off">
          </label>
        </div>

        <label class="zona-subida">
          <input type="file" id="pedidos-archivos" accept="image/*" multiple hidden>
          <span class="zona-icono">📷</span>
          <span class="zona-texto">Sacar o elegir fotos de tickets</span>
          <span class="zona-ayuda">Podés elegir varias a la vez</span>
        </label>

        <div id="bloque-pendientes" hidden>
          <p class="ayuda">Revisá que cada número esté bien antes de guardar.</p>
          <div id="pendientes" class="pendientes"></div>
          <div class="acciones">
            <button type="button" class="btn btn-fantasma" id="btn-descartar">Descartar</button>
            <button type="button" class="btn btn-primario" id="btn-guardar-pedidos">Guardar</button>
          </div>
        </div>
      </section>

      <section class="tarjeta-seccion">
        <div class="titulo-con-accion">
          <h2 class="titulo-seccion" id="titulo-lista-pedidos">Pedidos</h2>
          <button type="button" class="btn btn-fantasma btn-chico" id="btn-imprimir">🖨️ PDF</button>
        </div>

        <div id="controles-dia-pedidos">
          <div class="navdia" id="navdia-pedidos"></div>
          <div class="chips chips-filtro" id="pedidos-filtro"></div>
        </div>

        <p class="resumen" id="resumen-pedidos"></p>
        <div id="lista-pedidos" class="galeria"></div>
      </section>
    </section>

    <!-- ───── PASE DE TURNO ───── -->
    <section id="vista-pases" class="vista" hidden>
      <section class="tarjeta-seccion">
        <h2 class="titulo-seccion">📋 Cargar pase de turno</h2>
        <div class="fila-campos">
          <div class="campo-grupo">
            <span class="etiqueta">Turno</span>
            <div class="chips" id="pase-turno"></div>
          </div>
          <label class="campo-grupo">
            <span class="etiqueta">Responsable</span>
            <input class="campo" id="pase-responsable" placeholder="Tu nombre" autocomplete="off">
          </label>
        </div>

        <div id="fotos-pase" class="fotos-pase"></div>

        <label class="campo-grupo">
          <span class="etiqueta">Notas (opcional)</span>
          <textarea class="campo" id="pase-notas" rows="3" placeholder="Novedades, incidentes, faltantes…"></textarea>
        </label>

        <div class="acciones">
          <button type="button" class="btn btn-fantasma" id="btn-limpiar-pase">Limpiar</button>
          <button type="button" class="btn btn-primario" id="btn-guardar-pase">Guardar pase</button>
        </div>
      </section>

      <section class="tarjeta-seccion">
        <h2 class="titulo-seccion">🕓 Historial</h2>
        <div class="navdia" id="navdia-pases"></div>
        <div id="lista-pases" class="lista-pases"></div>
      </section>
    </section>
  </main>
</div>

<!-- ═════════ VISOR DE FOTOS ═════════ -->
<div id="visor" class="visor" hidden role="dialog" aria-modal="true" aria-labelledby="visor-titulo">
  <div class="visor-barra">
    <div class="visor-textos">
      <div class="visor-titulo" id="visor-titulo"></div>
      <div class="visor-detalle" id="visor-detalle"></div>
    </div>
    <button type="button" class="btn btn-icono" id="visor-cerrar" aria-label="Cerrar">✕</button>
  </div>

  <div class="visor-marco" id="visor-marco">
    <img id="visor-img" alt="">
    <div class="visor-cargando" id="visor-cargando">Cargando…</div>
  </div>

  <form id="visor-editar" class="visor-editar" hidden>
    <input class="campo" id="visor-numero" inputmode="numeric" autocomplete="off" aria-label="Número de pedido">
    <button type="submit" class="btn btn-primario">Guardar</button>
    <button type="button" class="btn btn-fantasma" id="visor-editar-cancelar">Cancelar</button>
  </form>

  <div class="visor-pie">
    <button type="button" class="btn btn-icono" id="visor-ant" aria-label="Anterior">‹</button>
    <span class="visor-contador" id="visor-contador"></span>
    <button type="button" class="btn btn-icono" id="visor-sig" aria-label="Siguiente">›</button>
  </div>

  <div class="visor-acciones">
    <button type="button" class="btn btn-fantasma" id="visor-compartir">📤 Compartir</button>
    <button type="button" class="btn btn-fantasma" id="visor-descargar">⬇️ Descargar</button>
    <button type="button" class="btn btn-fantasma" id="visor-btn-editar">✏️ Número</button>
    <button type="button" class="btn btn-peligro" id="visor-borrar">🗑 Borrar</button>
  </div>
</div>

<div id="avisos" class="avisos" aria-live="polite"></div>
</body>
</html>
